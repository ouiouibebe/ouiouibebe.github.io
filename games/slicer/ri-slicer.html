<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ri Slicer Game 🌲</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="ri-slicer.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css"
    />
  </head>
  <body>
    <!-- Exit button to go back to forest clearing -->
    <button id="exitBtn" onclick="window.location.href='../../index.html'">🌲 Back to Forest</button>
    
    <!-- Sound Toggle Button -->
    <button id="soundToggleBtn" style="position: fixed; top: 30px; right: 30px; z-index: 1300; background: #fffbe6; color: #6B8E3D; border: 2px dashed #bfa76a; border-radius: 8px; padding: 0.5rem 1.2rem; font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: 2px 4px 12px rgba(0,0,0,0.13); display: none;">🔊 Sound On</button>
    
    <script src="../../assets/radio.js"></script>
    
    <div id="container">

            <div id="fruitcontainer">
        <div id="front">
          <div class="instructions">
            <h2>🌲 Ri Slicer 🌲</h2>
            <h3>How to Play:</h3>
            <p>🎯 <strong>Slice the bad items</strong> by hovering over them!</p>
            <p>🌿 <strong>DON'T slice Scottish Ri</strong> - let them fall through to gain lives!</p>
            <p>💚 <strong>Miss good items</strong> and you'll lose a life!</p>
            <p>🏆 <strong>Score points</strong> by slicing the right targets!</p>
          </div>
        </div>
        <div id="score">
          <div class="scoreDisplay">
            <div class="score-icon">🌟</div>
            <span id="scoreValue">0</span>
          </div>
        </div>
        <div id="trialsleft"></div>
        <div id="fallingObjects"></div>
        <!--for game over block-->
        <div id="gameOver"></div>
      </div>
      <div id="gameControls">
        <div id="startReset">
          Start Game
        </div>
        <div id="pauseBtn">
          Pause
        </div>
      </div>
    </div>
    <!--for audio files-->
    <audio id="slicesound">
      <source src="data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjIwLjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAADQABISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhISEhI//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjM1AAAAAAAAAAAAAAAAJAYAAAAAAAAAQA" />
    </audio>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.4/jquery-ui.min.js"></script>
    <script src="ri-slicer.js"></script>
  </body>
</html>
