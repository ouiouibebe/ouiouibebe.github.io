<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💚</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #2F4F2F 0%, #6B8E3D 100%);
      background-size: cover;
      font-family: 'Open Sans', sans-serif;
      color: #2C1810;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 2rem;
      background: #fffbe6;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,0,0,0.18);
      border: 3px dashed #bfa76a;
      text-align: center;
    }
    .letter {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #8B6914;
      margin: 3rem 0;
      line-height: 1.6;
    }
    .signoff {
      margin-top: 3rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #bfa76a;
      text-align: right;
    }
    .back-link {
      text-align: center;
      margin-top: 3rem;
    }
    .back-link a {
      color: #6B8E3D;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      font-family: 'Playfair Display', serif;
      background: #eaf5ea;
      padding: 0.7rem 1.5rem;
      border-radius: 10px;
      border: 2px solid #bfa76a;
      transition: background 0.2s, color 0.2s;
    }
    .back-link a:hover {
      background: #bfa76a;
      color: #fffbe6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="letter">
      I love you Andrea
    </div>
    <div class="signoff">- Sujay Nair</div>
    <div class="back-link">
      <a href="index.html">← Back to Letters</a>
    </div>
  </div>
</body>
</html>
