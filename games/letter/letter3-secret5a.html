<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #2F4F2F 0%, #6B8E3D 100%);
      background-size: cover;
      font-family: 'Open Sans', sans-serif;
      color: #2C1810;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 3rem 2rem;
      background: #fffbe6;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,0,0,0.18);
      border: 3px dashed #bfa76a;
      text-align: center;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #8B6914;
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .btn {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 1rem 2.5rem;
      border-radius: 12px;
      border: 2px solid #bfa76a;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .btn-yes {
      background: #6B8E3D;
      color: #fffbe6;
    }
    .btn-yes:hover {
      background: #4d7860;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22);
    }
    .btn-no {
      background: #eaf5ea;
      color: #8B6914;
    }
    .btn-no:hover {
      background: #bfa76a;
      color: #fffbe6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>are you 10000000000000% sure</h1>
    <div class="buttons">
      <a href="letter3-secret5.html" class="btn btn-yes">Yes</a>
      <a href="letter3.html" class="btn btn-no">No</a>
    </div>
  </div>
</body>
</html>
