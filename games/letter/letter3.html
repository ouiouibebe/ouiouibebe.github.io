<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 Letter for Ri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #2F4F2F 0%, #6B8E3D 100%);
      background-size: cover;
      font-family: 'Open Sans', sans-serif;
      color: #2C1810;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .container {
      max-width: 700px;
      margin: 8vh auto 0 auto;
      padding: 2.5rem 2rem 2rem 2rem;
      background: #fffbe6;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,0,0,0.18);
      border: 3px dashed #bfa76a;
      position: relative;
      z-index: 10;
      text-align: left;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #8B6914;
      text-shadow: 1px 1px 2px #f7e7b6;
      letter-spacing: 1px;
      text-align: center;
    }
    .letter {
      font-family: 'Nunito', cursive;
      font-size: 1.15rem;
      color: #4A3520;
      margin-top: 1.5rem;
      line-height: 1.7;
    }
    .signoff {
      margin-top: 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #bfa76a;
      text-align: right;
    }
    .back-link {
      text-align: center;
      margin-top: 2.5rem;
    }
    .back-link a {
      color: #6B8E3D;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      font-family: 'Playfair Display', serif;
      background: #eaf5ea;
      padding: 0.7rem 1.5rem;
      border-radius: 10px;
      border: 2px solid #bfa76a;
      transition: background 0.2s, color 0.2s;
    }
    .back-link a:hover {
      background: #bfa76a;
      color: #fffbe6;
    }
    @media (max-width: 800px) {
      .container { padding: 1.2rem 0.5rem; }
      h1 { font-size: 1.5rem; }
    }
    .locked-message {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #8B6914;
      margin: 3rem 0 2rem 0;
    }
  </style>
</head>
<body>
  <script>
    // ============================================
    // 🔓 LETTER LOCK CONTROL
    // Change this to true when ready to unlock!
    // ============================================
    const LETTER_UNLOCKED = false;
  </script>
  
  <div id="lockedOverlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(47,79,47,0.97);z-index:2000;display:none;align-items:center;justify-content:center;">
    <div style="background:#fffbe6;border:3px dashed #bfa76a;border-radius:18px;box-shadow:0 0 40px rgba(0,0,0,0.18);padding:3rem 2.5rem;max-width:450px;width:90%;text-align:center;">
      <div style="font-size:4rem;margin-bottom:1.5rem;">🔒</div>
      <div style="font-family:'Playfair Display',serif;font-size:1.8rem;color:#8B6914;margin-bottom:1rem;letter-spacing:1px;">Not Time Yet!</div>
      <div style="font-family:'Nunito',sans-serif;font-size:1.1rem;color:#4A3520;margin-bottom:2rem;line-height:1.6;">This letter will be available soon. Check back on the date shown! 💚</div>
      <a href="index.html" style="color:#6B8E3D;text-decoration:none;font-weight:700;font-size:1.1rem;font-family:'Playfair Display',serif;background:#eaf5ea;padding:0.8rem 1.8rem;border-radius:10px;border:2px solid #bfa76a;transition:background 0.2s, color 0.2s;display:inline-block;">← Back to Letters</a>
    </div>
  </div>
  
  <div id="letterContent" class="container">
    <h1>💌 Letter Title (10/19/2025)</h1>
    <div class="date" style="text-align:right; color:#bfa76a; font-size:1rem; margin-bottom:1.5rem;">October 19th, 2025</div>
    <div class="letter">
      <p>Letter content coming soon...</p>
      <div class="signoff">-bae (sujay)</div>
    </div>
    <div class="back-link">
      <a href="index.html">← Back to Letters</a>
    </div>
  </div>
  
  <script>
    // Check if letter is unlocked
    const lockedOverlay = document.getElementById('lockedOverlay');
    const letterContent = document.getElementById('letterContent');
    
    if (!LETTER_UNLOCKED) {
      lockedOverlay.style.display = 'flex';
      letterContent.style.display = 'none';
    }
  </script>
</body>
</html>
