<body>
    <h1>Ri-Ra-Ro</h1>
    
    <!-- Sound Toggle Button -->
    <button id="soundToggleBtn" style="position: fixed; top: 30px; left: 30px; z-index: 1300; background: #fffbe6; color: #6B8E3D; border: 2px dashed #bfa76a; border-radius: 8px; padding: 0.5rem 1.2rem; font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: 2px 4px 12px rgba(0,0,0,0.13); display: none;">🔊 Sound On</button>
    
    <!-- Game Setup Section -->
    <div class="game-setup" id="gameSetup">
        <h2>Game Setup</h2>
        <div class="setup-options">
            <div class="setup-group">
                <label>Game Mode:</label>
                <select id="gameMode">
                    <option value="pvp">Player vs Player</option>
                    <option value="ai">Player vs AI</option>
                </select>
            </div>
            
            <div class="setup-group" id="aiOptions" style="display: none;">
                <label>AI Difficulty:</label>
                <select id="aiDifficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            
            <div class="setup-group" id="firstPlayerOptions" style="display: none;">
                <label>Who Goes First:</label>
                <select id="firstPlayer">
                    <option value="player">You First</option>
                    <option value="ai">AI First</option>
                </select>
            </div>
            
            <!-- Avatar Selection -->
            <div class="avatar-selection">
                <h3>Choose Your Avatars</h3>
                <div class="avatar-options">
                    <div class="avatar-group">
                        <label>X Player Avatar:</label>
                        <div class="avatar-grid">
                            <div class="avatar-option" data-player="X" data-avatar="pics/X-Player.png">
                                <img src="pics/X-Player.png" alt="X Avatar 1">
                                <span>Classic</span>
                            </div>
                            <div class="avatar-option" data-player="X" data-avatar="pics/X-Player1.png">
                                <img src="pics/X-Player1.png" alt="X Avatar 2">
                                <span>Style 1</span>
                            </div>
                            <div class="avatar-option" data-player="X" data-avatar="pics/X-Player2.png">
                                <img src="pics/X-Player2.png" alt="X Avatar 3">
                                <span>Style 2</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="avatar-group">
                        <label>O Player Avatar:</label>
                        <div class="avatar-grid">
                            <div class="avatar-option" data-player="O" data-avatar="pics/O-Player.png">
                                <img src="pics/O-Player.png" alt="O Avatar 1">
                                <span>Classic</span>
                            </div>
                            <div class="avatar-option" data-player="O" data-avatar="pics/O-Player1.png">
                                <img src="pics/O-Player1.png" alt="O Avatar 2">
                                <span>Style 1</span>
                            </div>
                            <div class="avatar-option" data-player="O" data-avatar="pics/O-Player2.png">
                                <img src="pics/O-Player2.png" alt="O Avatar 3">
                                <span>Style 2</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button id="startGameBtn" class="start-btn">Start Game</button>
        <div style="margin-top: 20px;">
            <a href="../../index.html" style="color: #eaffea; text-decoration: none; font-weight: 600; font-size: 1.1rem; padding: 8px 16px; border-radius: 8px; background-color: rgba(255, 255, 255, 0.1); transition: background-color 0.3s;">← Back to Forest Clearing</a>
        </div>
    </div>

    <!-- Game Board (initially hidden) -->
    <div class="game-board" id="gameBoard" style="display: none;">
        <div class="game-info">
            <div class="mode-display" id="modeDisplay"></div>
            <div class="difficulty-display" id="difficultyDisplay" style="display: none;"></div>
        </div>
        
        <div class="container">
            <div data-index="0" class="box"></div>
            <div data-index="1" class="box"></div>
            <div data-index="2" class="box"></div>
            <div data-index="3" class="box"></div>
            <div data-index="4" class="box"></div>
            <div data-index="5" class="box"></div>
            <div data-index="6" class="box"></div>
            <div data-index="7" class="box"></div>
            <div data-index="8" class="box"></div>
        </div>
        <div class="status"></div>
        <div class="game-controls">
            <button class="restartBtn">Restart 🔁</button>
            <button class="newGameBtn">New Game</button>
        </div>
        <div style="margin-top: 20px; text-align: center;">
            <a href="../../index.html" style="color: #eaffea; text-decoration: none; font-weight: 600; font-size: 1.1rem; padding: 8px 16px; border-radius: 8px; background-color: rgba(255, 255, 255, 0.1); transition: background-color 0.3s;">← Back to Forest Clearing</a>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bgMusic" loop>
        <source src="../../assets/audio/Iris and I.mp3" type="audio/mpeg">
    </audio>

    <script src="Ri-index.js"></script>
</body>

</html>
